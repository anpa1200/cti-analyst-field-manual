name: Build Docusaurus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate YAML governance register
        run: python3 -c "import yaml, sys; yaml.safe_load(open('data/correlation-register.yml')); print('YAML valid')"
      - name: Install dependencies
        run: npm ci
      - name: Check local links
        run: npm run check:links
      - name: Build
        run: npm run build
